 <!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>AdCoin Ads Test</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<!-- AdsGram official SDK -->
<script src="https://sad.adsgram.ai/js/sad.min.js"></script>

<style>

body{
    margin:0;
    background:#07111f;
    color:white;
    font-family:Arial;
    text-align:center;
    padding:30px 20px;
}

.box{
    max-width:420px;
    margin:auto;
    background:#0e1b2b;
    padding:25px;
    border-radius:20px;
}

button{
    width:100%;
    padding:16px;
    border:0;
    border-radius:14px;
    background:#00d084;
    font-size:17px;
    font-weight:bold;
    margin-top:20px;
}

#status{
    margin-top:20px;
    color:#9fb0c3;
}

</style>

</head>

<body>

<div class="box">

<h1>🪙 AdCoin</h1>

<p>
Watch a rewarded ad
</p>

<button id="watchAd">
▶ Watch Ad
</button>

<div id="status">
Ready
</div>

</div>


<script>

/* Telegram */

Telegram.WebApp.ready();

Telegram.WebApp.expand();


/*
IMPORTANT:
AdsGram Reward Block ID
MUST be a STRING.
*/

const BLOCK_ID = "50759";


/*
Initialize AdsGram
*/

let AdController;

try{

AdController =
window.Adsgram.init({

blockId: BLOCK_ID,

debug: true,

debugConsole: true

});

document.getElementById("status").textContent =
"AdsGram initialized successfully.";

}catch(error){

console.error(error);

document.getElementById("status").textContent =
"Init Error: " +
(error.message || error);

}


/*
Watch Ad
*/

document
.getElementById("watchAd")
.addEventListener(
"click",
async function(){

const status =
document.getElementById("status");

status.textContent =
"Loading advertisement...";


try{

const result =
await AdController.show();


console.log(
"AdsGram result:",
result
);


status.textContent =
"✅ Ad completed successfully!";


alert(
"✅ Ad completed!"
);


/*
Reward will be added here later.
*/

}catch(error){

console.error(
"AdsGram error:",
error
);


status.textContent =
"❌ " +
(error.description ||
error.message ||
"Ad failed");


alert(
"AdsGram Error:\n\n" +
(
error.description ||
error.message ||
JSON.stringify(error)
)
);

}

});

</script>

</body>
</html>
