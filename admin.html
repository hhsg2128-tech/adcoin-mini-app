<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AdCoin Admin</title><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script><style>body{margin:0;background:#07111f;color:white;font:15px Arial}.wrap{max-width:1000px;margin:auto;padding:20px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card,.stat{background:#0e1b2b;border:1px solid #1c3048;border-radius:16px;padding:18px;margin-top:16px}.stat b{display:block;font-size:28px;margin-top:8px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid #203247}th{color:#91a4ba}.muted{color:#8da0b5;font-size:13px}input,textarea{width:100%;box-sizing:border-box;padding:12px;margin-top:7px;background:#081522;color:white;border:1px solid #29405a;border-radius:9px}button{border:0;border-radius:9px;padding:10px 14px;font-weight:bold;background:#00d084;margin-top:10px}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}.table{overflow:auto}}</style></head><body><div class="wrap"><h2>🪙 AdCoin Admin</h2><div class="grid"><div class="stat">👥 Users<b id="users">0</b></div><div class="stat">🪙 Coins<b id="coins">0</b></div><div class="stat">📺 Ads<b id="ads">0</b></div><div class="stat">💸 Withdrawals<b>0</b></div></div><div class="card"><h2>⚙️ Settings</h2><label class="muted">Reward per verified ad</label><input id="reward" type="number" value="10"><label class="muted">Minimum withdrawal</label><input id="minimum" type="number" value="1000"><button onclick="save()">Save settings</button></div><div class="card"><h2>👥 Users</h2><div style="overflow:auto"><table><thead><tr><th>Telegram ID</th><th>Name</th><th>Balance</th><th>Ads</th></tr></thead><tbody id="rows"><tr><td colspan="4">Loading...</td></tr></tbody></table></div></div><div class="card"><h2>📢 Announcement</h2><textarea id="ann" rows="4" placeholder="Write announcement"></textarea><button onclick="announce()">Save announcement</button></div><div class="card"><b>🔒 Security</b><p class="muted">This is the first admin UI. Real balance changes and withdrawals should only be enabled after secure admin authentication/backend authorization is added.</p></div></div><script>const c={apiKey:"AIzaSyDnQPm57HTYnaglTEMj0Ez1Vm6NsZ21nyY",authDomain:"unique-tour-6f65d.firebaseapp.com",databaseURL:"https://unique-tour-6f65d-default-rtdb.firebaseio.com",projectId:"unique-tour-6f65d",storageBucket:"unique-tour-6f65d.firebasestorage.app",messagingSenderId:"314084431584",appId:"1:314084431584:web:249c97883913a2199de285",measurementId:"G-Q95BZS765X"};firebase.initializeApp(c);const db=firebase.database();db.ref("users").on("value",s=>{let d=s.val()||{},n=Object.keys(d),co=0,ad=0,r="";n.forEach(id=>{let u=d[id]||{};co+=+u.balance||0;ad+=+u.totalAds||0;r+=`<tr><td>${id}</td><td>${u.name||"-"}</td><td>${u.balance||0}</td><td>${u.totalAds||0}</td></tr>`});users.textContent=n.length;coins.textContent=co;ads.textContent=ad;rows.innerHTML=r||'<tr><td colspan="4">No users</td></tr>'});function save(){db.ref("settings").update({adReward:+reward.value||0,minimumWithdrawal:+minimum.value||0}).then(()=>alert("Saved"))}function announce(){let x=ann.value.trim();if(x)db.ref("settings/announcement").set(x).then(()=>alert("Saved"))}</script></body></html>
